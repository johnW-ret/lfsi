name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet tool restore
      - run: dotnet fantomas --check .
      - run: dotnet test tests/Lfsi.Tests/Lfsi.Tests.fsproj --configuration Release

      - name: Pack
        run: dotnet pack src/Lfsi.App/Lfsi.App.fsproj --configuration Release --output artifacts/packages /p:PackageVersion=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: lfsi-${{ steps.version.outputs.value }}
          path: artifacts/packages/*.nupkg

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*.nupkg
